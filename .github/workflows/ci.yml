name: Validate analyzers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      package_version:
        description: Validated package version
        value: ${{ jobs.validate.outputs.package_version }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Freeze timestamp version
        id: version
        shell: bash
        run: |
          version_timestamp="$(date -u '+%y %m %d %H %M %S')"
          echo "VERSION_TIMESTAMP=$version_timestamp" >> "$GITHUB_ENV"
          package_version="$(dotnet msbuild src/NetAgents.Analyzers.csproj -getProperty:PackageVersion "-p:VersionTimestamp=$version_timestamp")"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore NetAgents.slnx
      - name: Build
        run: dotnet build NetAgents.slnx --configuration Release --no-restore "-p:VersionTimestamp=$VERSION_TIMESTAMP"
      - name: Check formatting
        run: dotnet format NetAgents.slnx --verify-no-changes --no-restore
      - name: Pack one analyzer package
        run: dotnet pack src/NetAgents.Analyzers.csproj --configuration Release --no-build --no-restore --output artifacts/packages "-p:VersionTimestamp=$VERSION_TIMESTAMP"
      - name: Test rules and package consumption
        env:
          NETAGENTS_PACKAGE_PATH: ${{ github.workspace }}/artifacts/packages/NetAgents.Analyzers.${{ steps.version.outputs.package_version }}.nupkg
        run: dotnet test NetAgents.slnx --configuration Release --no-build --no-restore
      - name: Upload validated package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
